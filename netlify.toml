# Freeborn — Netlify deployment (Next.js App Router)
# The Next.js runtime plugin is applied automatically by Netlify at build
# time — nothing needs to be installed locally.
[build]
  command = "next build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
