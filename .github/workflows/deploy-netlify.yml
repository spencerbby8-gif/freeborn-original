name: Deploy to Netlify

# Deploys EVERY build: runs on every push to main (merges included) and can
# be triggered manually. Pull requests are verified by the CI workflow; this
# one ships production.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-netlify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to Netlify (production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture current production deploy
        id: before
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          ID=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" | python3 -c "import json,sys; print((json.load(sys.stdin).get('published_deploy') or {}).get('id') or '')")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "current production deploy: $ID"

      # The CLI builds on the runner itself (no docker wrapper) — the
      # netlify/actions/cli docker image could not find `next` (ENOENT) and
      # silently produced canceled deploys.
      - name: Deploy to Netlify (production)
        run: npx --yes netlify-cli deploy --build --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # Inlined into the client bundle at build time:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://freeborn.netlify.app' }}
          # Server-only values, available to the build process (the deployed
          # app reads these at runtime from Netlify site env vars):
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TRANSACTION_POOLER: ${{ secrets.SUPABASE_TRANSACTION_POOLER }}
          ANTIGRAVITY_BASE_URL: ${{ secrets.ANTIGRAVITY_BASE_URL }}
          ANTIGRAVITY_FREE_API_KEY: ${{ secrets.ANTIGRAVITY_FREE_API_KEY }}
          VOID_AI_BASE_URL: ${{ secrets.VOID_AI_BASE_URL }}
          VOID_AI_API_KEY: ${{ secrets.VOID_AI_API_KEY }}

      # Fail loudly if the deploy was canceled or never went live — the
      # Netlify CLI can exit 0 even when nothing was published.
      - name: Verify the new deploy is live
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          for i in $(seq 1 18); do
            OUT=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
            ID=$(printf '%s' "$OUT" | python3 -c "import json,sys; print((json.load(sys.stdin).get('published_deploy') or {}).get('id') or '')")
            STATE=$(printf '%s' "$OUT" | python3 -c "import json,sys; print((json.load(sys.stdin).get('published_deploy') or {}).get('state') or '')")
            echo "published deploy: $ID ($STATE)"
            if [ "$ID" != "${{ steps.before.outputs.id }}" ] && [ "$STATE" = "ready" ]; then
              echo "NEW DEPLOY IS LIVE"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: production did not switch to the new deploy" >&2
          exit 1
