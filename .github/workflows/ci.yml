name: CI — typecheck / lint / secret scan / build

on:
  push:
    branches: [main, feat/member-stories-calls-chat]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required for applied-migration immutability checks

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24 # matches Vercel production
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (blocking)
        run: npm run check:secrets

      - name: Environment isolation (blocking)
        run: npm run check:env

      - name: Migration completeness and immutability (blocking)
        run: npm run check:migrations

      - name: Dependency advisories — runtime deps (blocking)
        run: npm audit --omit=dev --audit-level=moderate

      # Dev-only advisories are reported but cannot block WHILE UPSTREAM HAS NO PATCH.
      # 2026-11-17: GHSA-fc5q-39xc-vjpf — picomatch ReDoS, affected <=4.0.7, patched
      # versions: NONE (fix PR micromatch/picomatch#194 still open). It reaches this
      # repo only through the eslint / typescript-eslint dev chain (`npm ls picomatch`
      # shows no runtime path), and the production install carries no devDependencies,
      # so no member-facing request can ever hand picomatch a glob. The blocking gate
      # above audits exactly the tree production runs and stays red on any advisory.
      # When picomatch ships a patch, delete this step and restore the single audit.
      - name: Dependency advisories — dev-only chain (warning while unpatched upstream)
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (blocking — F10)
        run: npm run lint

      # The trust harness is this repo's only gate on what TypeScript cannot see: migration text
      # vs schema, RLS predicates, component <-> stylesheet pairings, the design contract. It was
      # not wired here, and `main` paid for it — two assertions were red for a full cycle because the
      # pins still demanded the string "NOT YET APPLIED" from migrations that had since been applied
      # to production and had their headers rewritten. Nothing ran the suite, so a failing self-check
      # shipped. It reads source only (no .next, no public/qa, no secrets), which is why it sits
      # before the build and outside its env block; `npm ci` above has already installed esbuild and
      # sharp, the only two tools it shells out to.
      - name: Trust harness (blocking)
        run: npm run test:harness

      - name: Vault crypto controls (blocking)
        run: npm run test:vault-crypto

      - name: Member auth recreated-email regression — local PostgreSQL
        run: npm run test:member-auth
        env:
          FREEBORN_AUTH_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db

      - name: Prototype API contracts — substituted adapters (blocking)
        run: npm run test:prototype-api

      - name: Media preview and attachment contracts (blocking)
        run: npm run test:chat-media

      - name: Discovery and filter-storage privacy contracts (blocking)
        run: npm run test:discovery-privacy && npm run test:filter-storage && npm run test:discovery-presentation && npm run test:notification-receipts && node scripts/seo/submission-contracts.mjs

      - name: Mutual-Filter Vault visibility contracts (blocking)
        run: npm run test:vault-visibility

      - name: Bing metadata descriptions and parser negative controls (blocking)
        run: npm run test:bing-metadata

      - name: Evidence URL and decoding negative controls (blocking)
        run: npm run test:evidence-safety

      - name: Engine request controls (blocking)
        run: npm run test:engines

      - name: Database TLS controls (blocking)
        run: npm run test:db-tls

      - name: Cloudflare TURN relay controls (blocking)
        run: npm run test:turn

      - name: Prepare disposable application schema
        run: npm run test:prepare-local

      - name: Member runtime regressions — real handlers, local SQL, fixture auth
        run: npm run test:member-runtime

      - name: FB-14 deletion regression (blocking)
        run: npm run test:deletion-local

      - name: Vault deletion regression (blocking)
        run: npm run test:vault-deletion-local

      - name: FB-15 retention regression (blocking)
        run: npm run test:retention-local

      - name: FB-15 retention worker unit tests (blocking)
        run: npm run test:retention-worker

      - name: Pose end-to-end acceptance (blocking)
        run: npm run test:pose

      - name: Pose negative control (blocking)
        run: npm run test:pose:negctl

      - name: Profile member/server write trigger regression (blocking)
        run: npm run test:profile-trigger

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: https://freeborn-umber.vercel.app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: .next
          retention-days: 7

  member-communications:
    name: Stories, settings and notification evidence — isolated PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: member_experience_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d member_experience_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare exact disposable loopback fixture database
        run: npm run test:settings-prepare
      - name: Real feature handlers and SQL — substituted auth and email transport
        run: npm run test:member-experience && npm run test:settings-audit
      - name: Clone local databases for actual additive migration replay
        run: |
          node --input-type=module -e "import pg from 'pg';const c=new pg.Client({connectionString:'postgresql://postgres:postgres@127.0.0.1:5432/postgres'});await c.connect();for(const db of ['member_migration_test','notification_migration_test'])await c.query('CREATE DATABASE '+db+' TEMPLATE member_experience_test');await c.end();"
      - name: Actual additive SQL, preservation, RLS and non-bypass runtime grants
        run: npm run test:member-migration && npm run test:notification-migration
      - name: Install Chromium for interactive fixture acceptance
        run: npx playwright install --with-deps chromium
      - name: Build with public fixture auth configuration only
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-publishable-key
      - name: Navigate Stories and Settings against real local handlers/SQL
        run: node scripts/settings-audit/run-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-member-evidence-${{ github.sha }}
          path: |
            scripts/member-experience/.evidence/
            scripts/settings-audit/.evidence/
          retention-days: 7
