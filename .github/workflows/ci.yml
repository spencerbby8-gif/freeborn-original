name: CI — typecheck / lint / secret scan / build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for applied-migration immutability checks

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24 # matches Vercel production
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (blocking)
        run: npm run check:secrets

      - name: Environment isolation (blocking)
        run: npm run check:env

      - name: Migration completeness and immutability (blocking)
        run: npm run check:migrations

      - name: Dependency advisories (blocking)
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (blocking — F10)
        run: npm run lint

      # The trust harness is this repo's only gate on what TypeScript cannot see: migration text
      # vs schema, RLS predicates, component <-> stylesheet pairings, the design contract. It was
      # not wired here, and `main` paid for it — two assertions were red for a full cycle because the
      # pins still demanded the string "NOT YET APPLIED" from migrations that had since been applied
      # to production and had their headers rewritten. Nothing ran the suite, so a failing self-check
      # shipped. It reads source only (no .next, no public/qa, no secrets), which is why it sits
      # before the build and outside its env block; `npm ci` above has already installed esbuild and
      # sharp, the only two tools it shells out to.
      - name: Trust harness (blocking)
        run: npm run test:harness

      - name: Engine request controls (blocking)
        run: npm run test:engines

      - name: Database TLS controls (blocking)
        run: npm run test:db-tls

      - name: Cloudflare TURN relay controls (blocking)
        run: npm run test:turn

      - name: Prepare disposable application schema
        run: npm run test:prepare-local

      - name: FB-14 deletion regression (blocking)
        run: npm run test:deletion-local

      - name: FB-15 retention regression (blocking)
        run: npm run test:retention-local

      - name: FB-15 retention worker unit tests (blocking)
        run: npm run test:retention-worker

      - name: Pose end-to-end acceptance (blocking)
        run: npm run test:pose

      - name: Pose negative control (blocking)
        run: npm run test:pose:negctl

      - name: Profile member/server write trigger regression (blocking)
        run: npm run test:profile-trigger

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: https://freeborn-umber.vercel.app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: .next
          retention-days: 7
