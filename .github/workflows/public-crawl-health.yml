name: Public crawl health
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check live public crawl signals (read only)
        run: node scripts/seo/crawl-health.mjs --output=public-crawl-health.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-crawl-health-${{ github.run_id }}
          path: public-crawl-health.json
          retention-days: 30
